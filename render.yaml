services:
  - type: web
    name: animalife-paraguay-api
    runtime: node
    buildCommand: npm install
    startCommand: npm --workspace apps/api start
    healthCheckPath: /health
  - type: static_site
    name: animalife-paraguay-web
    buildCommand: npm install && npm run build:web
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
